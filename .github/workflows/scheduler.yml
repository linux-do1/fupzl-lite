name: litefupzl scheduler

on:
  schedule:
    # GitHub cron is UTC: 09:30 and 15:30 UTC+8.
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: litefupzl-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Dispatch oneshot
        env:
          SCHEDULER_TOKEN: ${{ secrets.LITEFUPZL_ACTIONS_ADMIN_TOKEN || secrets.FUCKPZL_ACTIONS_ADMIN_TOKEN }}
          ONESHOT_REF: ${{ github.event.repository.default_branch }}
        run: python3 apps/litefupzl/dispatch_oneshot.py
